[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergerisk"
version = "1.5.0"
description = "Static post-merge semantic risk analysis for Python repositories"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src", "detector" = "detector"}
packages = [
  "detector",
  "mergerisk",
  "mergerisk.analysis",
  "mergerisk.domain",
  "mergerisk.eval",
  "mergerisk.git",
  "mergerisk.reporting",
  "mergerisk.rules",
  "mergerisk.semantic",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
