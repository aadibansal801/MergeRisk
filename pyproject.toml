[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergerisk"
version = "2.0.0"
description = "Local-first semantic Git merge diagnosis, verified repairs and dashboard"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4"]

[project.scripts]
mergerisk = "mergerisk.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<0.29", "build>=1,<2"]

[tool.setuptools]
package-dir = {"" = "src", "detector" = "detector"}
packages = [
  "detector",
  "mergerisk",
  "mergerisk.analysis",
  "mergerisk.domain",
  "mergerisk.eval",
  "mergerisk.git",
  "mergerisk.reporting",
  "mergerisk.rules",
  "mergerisk.semantic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
mergerisk = ["templates/*.html", "static/*.css", "static/*.js"]
